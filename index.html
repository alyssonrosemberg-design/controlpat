async function hashCred(email,pass){
  try{
    const s=(email||'').toLowerCase().trim()+'::'+String(pass||'');
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    let h=0,s=(email||'').toLowerCase().trim()+'::'+String(pass||'');
    for(let i=0;i<s.length;i++)h=(Math.imul(31,h)+s.charCodeAt(i))|0;
    return 'h_'+Math.abs(h);
  }
}

function isNetworkError(e){
  if(!navigator.onLine)return true;
  const m=String(e?.message||e||'').toLowerCase();
  return m.includes('failed to fetch')||m.includes('network')||m.includes('networkerror')||m.includes('timeout')||m.includes('offline')||m.includes('abort');
}

async function checkRealConnection(){
  if(!navigator.onLine){
    isAppOnline=false;
    updateOnlineBadge();
    return false;
  }
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),2500);
    const res=await fetch(`${SUPABASE_URL}/auth/v1/health`,{method:'HEAD',signal:ctrl.signal}).catch(()=>null);
    clearTimeout(tid);
    isAppOnline=!!(res&&(res.status>=200&&res.status<500));
  }catch(e){
    isAppOnline=false;
  }
  updateOnlineBadge();
  return isAppOnline;
}

async function boot(){
  await checkRealConnection();
  if(isAppOnline){
    try{
      const getSessionPromise=sb.auth.getSession();
      const timeoutPromise=new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),3000));
      const{data:{session}}=await Promise.race([getSessionPromise,timeoutPromise]);
      if(session){
        const getP=()=>sb.from('perfis').select('*').eq('id',session.user.id).maybeSingle();
        let{data,error}=await getP();
        if(!data){await sb.rpc('garantir_perfil');({data,error}=await getP())}
        if(!data||!data.ativo){
          const why=error?'Erro do banco: '+error.message:(data?'Sua conta está desativada.':'Perfil não encontrado para '+session.user.email+'.');
          $('#app').innerHTML=`<div class="card" id="login"><p>Seu acesso ainda não foi liberado por um administrador.</p><p class="err" style="font-size:13px">${esc(why)}</p><button onclick="sair()">Sair</button></div>`;
          return;
        }
        ME=data;
        setActiveProfile(ME);
        shell();
        await refresh();
        autoSyncIfOnline();
        return;
      }
    }catch(e){
      console.warn('Erro ou timeout ao obter sessão online:',e);
      isAppOnline=false;
    }
  }

  // Se estiver offline ou sem sessão online ativa, verifica se já existe perfil ativo salvo
  const activeMe=getActiveProfile();
  if(activeMe){
    ME=activeMe;
    shell();
    await refresh();
    return;
  }

  ME=null;
  loginView();
}

function loginView(msg=''){
  const savedUsers=getOfflineUsers();
  const savedEmails=Object.keys(savedUsers);
  let lastEm='';
  try{lastEm=localStorage.getItem(STORAGE.LAST_EMAIL)||(savedEmails[0]||'')}catch(e){}
  const off=!isAppOnline;

  $('#app').innerHTML=`<div class="card" id="login">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <h1 style="margin:0">📦 Patrimônio</h1>
      <span class="tag ${off?'err':'ok'}" style="font-size:11px">${off?'Modo Offline':'Conectado'}</span>
    </div>
    <p class="mut" style="margin:4px 0 12px">Entre com sua conta.</p>
    
    <label>E-mail</label>
    <input id="em" type="email" value="${esc(lastEm)}" autocomplete="email">
    <label style="margin-top:8px">Senha</label>
    <input id="pw" type="password" autocomplete="current-password">
    
    <p id="lmsg" class="${msg.startsWith('✔')?'ok':'err'}" style="margin:8px 0 0;font-size:13px">${esc(msg)}</p>
    
    <div style="margin-top:14px">
      <button class="pri" id="bi" style="width:100%">Entrar</button>
    </div>
    
    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--bd);font-size:12px;color:var(--mut)">
      <p style="margin:0 0 4px">💡 <b>Acesso Offline ao Sistema:</b></p>
      <span>Para entrar sem internet, é necessário fazer login com o usuário online pelo menos uma vez neste aparelho. Os dados ficarão salvos para uso offline.</span>
      ${savedEmails.length?`<div style="margin-top:8px;padding:6px 8px;background:var(--bg);border-radius:6px">
        <b>Usuários disponíveis offline neste aparelho:</b><br>
        ${savedEmails.map(e=>`· <a href="#" onclick="$('#em').value='${esc(e)}';$('#pw').focus();return false" style="color:var(--pri)">${esc(e)}</a>`).join('<br>')}
      </div>`:''}
    </div>
  </div>`;

  const cred=()=>({email:$('#em').value.trim(),password:$('#pw').value});

  $('#bi').onclick=async()=>{
    const c=cred();
    if(!c.email||!c.password){loginView('Informe e-mail e senha.');return}
    const btn=$('#bi');if(btn){btn.disabled=true;btn.textContent='Verificando…'}
    try{localStorage.setItem(STORAGE.LAST_EMAIL,c.email)}catch(e){}

    const online=await checkRealConnection();
    if(online){
      // Autenticação ONLINE no Supabase
      const{data,error}=await sb.auth.signInWithPassword(c);
      if(error){
        // Se erro for de rede imprevisto, tenta offline
        if(isNetworkError(error)){
          return tentarLoginOffline(c,savedUsers);
        }
        loginView(error.message);return;
      }
      try{
        const getP=()=>sb.from('perfis').select('*').eq('id',data.user.id).maybeSingle();
        let{data:perfil,error:perr}=await getP();
        if(!perfil){await sb.rpc('garantir_perfil');({data:perfil,error:perr}=await getP())}
        if(perfil&&perfil.ativo){
          const h=await hashCred(c.email,c.password);
          saveOfflineUser(c.email,h,perfil);
          setActiveProfile(perfil);
          ME=perfil;
          shell();
          await refresh();
          autoSyncIfOnline();
          return;
        }else{
          loginView(perfil?'Sua conta está desativada.':'Perfil não encontrado no sistema.');return;
        }
      }catch(pe){
        loginView('Erro ao carregar perfil: '+(pe.message||pe));return;
      }
    }else{
      tentarLoginOffline(c,savedUsers);
    }
  };

  $('#pw').onkeydown=e=>{if(e.key==='Enter')$('#bi').click()};
}

async function tentarLoginOffline(c,savedUsers){
  const userKey=(c.email||'').toLowerCase().trim();
  const savedUser=savedUsers[userKey];
  if(!savedUser){
    loginView('Este usuário ainda não entrou online neste aparelho. Conecte-se à internet para entrar a primeira vez.');
    return;
  }
  const h=await hashCred(c.email,c.password);
  if(h!==savedUser.hash){
    loginView('Senha incorreta para acesso offline neste aparelho.');
    return;
  }
  ME=savedUser.profile;
  setActiveProfile(ME);
  isAppOnline=false;
  shell();
  await refresh();
}

async function sair(){
  const pend=getOfflineConferences().length;
  if(pend>0){
    if(!confirm(`Atenção: há ${pend} conferência(s) offline pendente(s) de envio.\n\nElas permanecerão salvas com segurança no aparelho.\n\nDeseja realmente sair agora?`))return;
  }else{
    if(!confirm('Deseja sair do sistema?'))return;
  }
  setActiveProfile(null);
  ME=null;
  try{if(isAppOnline)await sb.auth.signOut()}catch(e){}
  loginView();
}

function filtradasGarantias(){
  const cfg=diasCfg();
  return S.bens.filter(b=>{
    if(b.status==='Baixado'||!b.garantia_ate)return false;
    if(FG.l&&b.local_id!==FG.l)return false;
    if(FG.q){
      const s=((b.tombo||'')+(b.descricao||'')+(b.marca||'')+(b.modelo||'')+(b.serie||'')+(b.responsavel||'')).toLowerCase();
      if(!s.includes(FG.q.toLowerCase()))return false;
    }
    const n=inDays(b.garantia_ate);
    if(FG.sit==='vencidas')return n<0;
    if(FG.sit==='vencendo')return n>=0&&n<=cfg;
    if(FG.sit==='vigentes')return n>cfg;
    if(FG.sit==='todos')return true;
    return n<=cfg;
  }).sort((a,b)=>a.garantia_ate<b.garantia_ate?-1:1);
}

/* ======== CATEGORIAS ======== */
const CAT_PADRAO=['Mobiliário','Informática','Equipamento','Veículo','Eletrodoméstico'];
function getCategoriasCustom(){
  try{const raw=localStorage.getItem('pat_categorias_custom');if(raw){const arr=JSON.parse(raw);if(Array.isArray(arr))return arr}}catch(e){}
  return [];
}
function saveCategoriasCustom(arr){try{localStorage.setItem('pat_categorias_custom',JSON.stringify(arr))}catch(e){}}
function getCategorias(){
  const custom=getCategoriasCustom();
  const dbCats=(S.categorias||[]).map(c=>typeof c==='string'?c:(c&&c.nome)).filter(Boolean);
  const bensCats=(S.bens||[]).map(b=>(b.categoria||'').trim()).filter(Boolean);
  const all=[...new Set([...CAT_PADRAO,...custom,...dbCats,...bensCats])].map(s=>s.trim()).filter(Boolean);
  return all.sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
async function addCategoria(nome){
  nome=(nome||'').trim();
  if(!nome)throw new Error('Informe o nome da categoria.');
  const cats=getCategorias();
  if(cats.some(c=>c.toLowerCase()===nome.toLowerCase()))throw new Error('Esta categoria já existe.');
  const custom=getCategoriasCustom();
  if(!custom.some(c=>c.toLowerCase()===nome.toLowerCase())){
    custom.push(nome);saveCategoriasCustom(custom);
  }
  try{await Repo.upsert('categorias',{nome});if(S.categorias)S.categorias.push({nome})}catch(e){}
  return nome;
}
async function delCategoria(nome){
  nome=(nome||'').trim();
  const emUso=(S.bens||[]).filter(b=>((b.categoria||'').trim().toLowerCase()===nome.toLowerCase())).length;
  if(emUso>0)throw new Error(`Não é possível excluir: existem ${emUso} bem(ns) nesta categoria.`);
  let custom=getCategoriasCustom();
  custom=custom.filter(c=>c.toLowerCase()!==nome.toLowerCase());
  saveCategoriasCustom(custom);
  try{
    const dbItem=(S.categorias||[]).find(c=>((c&&c.nome)||c).toLowerCase()===nome.toLowerCase());
    if(dbItem?.id)await Repo.remove('categorias',dbItem.id);
  }catch(e){}
}
function formNovaCategoria(){
  const cats=getCategorias(),contagem={},customList=getCategoriasCustom();

  <div style="max-height:260px;overflow-y:auto;border:1px solid var(--bd);border-radius:8px">

    ${cats.map(c=>{

      </td></tr>`;

async function salvarNovaCategoria(){
  const inp=$('#novaCatNome'),err=$('#catErr'),ok=$('#catOk');
  if(!inp)return;err.textContent='';ok.textContent='';
  const nome=(inp.value||'').trim();
  if(!nome){err.textContent='Informe o nome da categoria.';return}
  try{
    await addCategoria(nome);
    ok.textContent=`Categoria "${nome}" cadastrada com sucesso!`;
    inp.value='';
    setTimeout(formNovaCategoria,500);
  }catch(e){err.textContent=e.message||String(e)}

async function removerCategoria(nome){
  if(!confirm(`Excluir a categoria "${nome}"?`))return;
  try{await delCategoria(nome);formNovaCategoria()}catch(e){alert(e.message||String(e))}
}
async function novaCategoriaRapida(){
  const nome=prompt('Nome da nova categoria:');
  if(!nome||!nome.trim())return;
  try{
    const cat=await addCategoria(nome.trim());
    const dl=$('#cats');if(dl)dl.innerHTML=getCategorias().map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
    const inp=$('#bemCatInput')||$('input[name=categoria]');
    if(inp)inp.value=cat;
  }catch(e){alert(e.message||String(e))}
}

/* ======== EXPORTAR / IMPORTAR ======== */
const CAMPOS=['tombo','descricao','categoria','marca','modelo','serie','valor','data_aquisicao','vida_util_anos','valor_residual','garantia_ate','estado','status','secretaria','gerencia','equipamento','responsavel','obs'];
function exportar(tipo){
  const rows=filtrados().map(b=>{const o={};CAMPOS.forEach(c=>o[c]=c==='secretaria'?(b.local_id?L(b.local_id):''):c==='gerencia'?(GN(b.gerencia_id)||''):c==='equipamento'?(EN(b.equipamento_id)||''):b[c]??'');o.valor_atual=deprec(b).atual.toFixed(2);return o});
  const ws=XLSX.utils.json_to_sheet(rows);
  if(tipo==='csv')salvarArquivo('patrimonio.csv',new Blob(['\ufeff'+XLSX.utils.sheet_to_csv(ws)],{type:'text/csv;charset=utf-8'}));
  else{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Bens');salvarArquivo('patrimonio.xlsx',new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/octet-stream'}))}}
async function importar(file){
  if(!file)return;const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  if(!rows.length)return alert('Arquivo vazio.');
  const norm=v=>v instanceof Date?v.toISOString().slice(0,10):String(v??'').trim(),low=s=>s.toLowerCase();
  const secs={},gers={},eqs={};S.locais.forEach(l=>secs[low(l.nome)]=l.id);(S.gerencias||[]).forEach(g=>gers[g.secretaria_id+'|'+low(g.nome)]=g.id);(S.equipamentos||[]).forEach(e=>eqs[e.gerencia_id+'|'+low(e.nome)]=e.id);
  const out=[];
  for(const r of rows){const o={};CAMPOS.forEach(c=>o[c]=norm(r[c]));if(!o.secretaria)o.secretaria=norm(r.local);
    if(!o.tombo||!o.descricao)continue;
    if(o.secretaria){const k=low(o.secretaria);if(!secs[k]){const[n]=await Repo.upsert('locais',{nome:o.secretaria});secs[k]=n.id}o.local_id=secs[k];
      if(!S.semEstrutura){
        if(o.gerencia){const kg=o.local_id+'|'+low(o.gerencia);if(!gers[kg]){const[n]=await Repo.upsert('gerencias',{secretaria_id:o.local_id,nome:o.gerencia});gers[kg]=n.id}o.gerencia_id=gers[kg];
          o.equipamento_id=null;if(o.equipamento){const ke=o.gerencia_id+'|'+low(o.equipamento);if(!eqs[ke]){const[n]=await Repo.upsert('equipamentos',{gerencia_id:o.gerencia_id,nome:o.equipamento});eqs[ke]=n.id}o.equipamento_id=eqs[ke]}}
        else{const ex=S.bens.find(x=>x.tombo.toLowerCase()===low(o.tombo)),same=ex&&ex.local_id===o.local_id;o.gerencia_id=same?(ex.gerencia_id||null):null;o.equipamento_id=same?(ex.equipamento_id||null):null}}}
    delete o.secretaria;delete o.gerencia;delete o.equipamento;
    ['valor','valor_residual'].forEach(k=>o[k]=+o[k]||0);o.vida_util_anos=o.vida_util_anos?+o.vida_util_anos:null;
    ['data_aquisicao','garantia_ate'].forEach(k=>o[k]=o[k]||null);o.estado=o.estado||'Bom';o.status=o.status||'Ativo';out.push(o)}
  if(!out.length)return alert('Nenhuma linha válida (tombo e descrição são obrigatórios).');
  if(!confirm(`Importar ${out.length} bens? Tombos já existentes serão atualizados. Secretarias, gerências e equipamentos novos serão criados.`))return;
  await Repo.upsert('bens',out,'tombo');alert('Importação concluída.');await refresh()}

  ${sec?`<div class="card">${head('🏢 Gerências — '+esc(sec.nome),A&&!S.semEstrutura?`<button class="sm pri" onclick="formEst('ger')">+ Nova gerência</button>`:'')}<div class="tw"><table><tr><th>Gerência</th><th>Sigla</th><th>Equipamentos</th><th>Bens</th><th>Situação</th><th></th></tr>

  ${ger?`<div class="card">${head('📍 Equipamentos / Unidades — '+esc(ger.nome),A?`<button class="sm pri" onclick="formEst('eq')">+ Novo equipamento</button>`:'')}<div class="tw"><table><tr><th>Equipamento / Unidade</th><th>Tipo</th><th>Endereço</th><th>Bens</th><th>Situação</th><th></th></tr>
  ${E.filter(e=>e.gerencia_id===selGer).map(x=>`<tr><td><b>${esc(x.nome)}</b></td><td>${esc(x.tipo)}</td><td style="white-space:normal">${esc(x.endereco)}</td><td>${nBens('equipamento_id',x.id)}</td><td>${sit(x)}</td><td>${acoes('eq',x)}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">Nenhum equipamento cadastrado.</td></tr>'}</table></div></div>`:(sec?'<p class="mut">Selecione uma gerência (Equipamentos ›) para ver e cadastrar seus equipamentos / unidades.</p>':'')}`}
function selEst(t,id){if(t==='sec'){selSec=id;selGer=''}else selGer=id;locais()}
function formEst(t,id){if(!adm())return;
  const x=id?S[TBL[t]].find(r=>r.id===id):{},ttl={sec:'secretaria',ger:'gerência',eq:'equipamento / unidade'}[t];

  ${t==='eq'?`<p class="mut" style="margin:0 0 8px">${esc(P((S.gerencias.find(g=>g.id===gid)||{}).secretaria_id,gid))}</p>`:''}
  <div class="g2">${f('nome','Nome *')}${t!=='eq'?f('sigla','Sigla'):''}${t==='sec'?f('setor','Setor / prédio'):''}
  ${t==='eq'?`<div><label>Tipo</label><input id="e_tipo" list="tiposEq" value="${esc(x.tipo)}"><datalist id="tiposEq">${['CRAS','CREAS','Almoxarifado','Unidade Básica de Saúde','Escola / Creche','Setor administrativo','Garagem / Oficina'].map(v=>`<option>${v}</option>`).join('')}</datalist></div>${f('endereco','Endereço')}`:''}</div>
  <p id="eerr" class="err"></p><div class="row" style="justify-content:flex-end"><button onclick="$('#dlg').close()">Cancelar</button><button class="pri" onclick="saveEst('${t}','${id||''}')">Salvar</button></div>`;

async function saveEst(t,id){if(!adm())return;
  if(S.semEstrutura&&t!=='sec'){$('#eerr').textContent='Rode o hierarquia.sql no Supabase primeiro.';return}
  const tb=TBL[t],old=id?S[tb].find(r=>r.id===id):null,g=k=>{const e=$('#e_'+k);return e?e.value.trim():undefined},nome=g('nome');
  if(!nome){$('#eerr').textContent='Informe o nome.';return}
  const par=t==='ger'?(old?old.secretaria_id:selSec):t==='eq'?(old?old.gerencia_id:selGer):null;
  if(S[tb].some(r=>r.id!==id&&r.nome.trim().toLowerCase()===nome.toLowerCase()&&(t==='sec'||(t==='ger'?r.secretaria_id===par:r.gerencia_id===par)))){$('#eerr').textContent='Já existe um registro com este nome neste nível.';return}
  const row={...(old||{ativo:true}),nome};
  if(t!=='eq')row.sigla=g('sigla')||null;if(t==='sec')row.setor=g('setor')||null;
  if(t==='eq'){row.tipo=g('tipo')||null;row.endereco=g('endereco')||null}
  if(t==='ger')row.secretaria_id=par;if(t==='eq')row.gerencia_id=par;
  if(S.semEstrutura&&t==='sec'){delete row.ativo;delete row.sigla}
  await Repo.upsert(tb,row);$('#dlg').close();await refresh()}

async function delEst(t,id){if(!adm())return;const tb=TBL[t],r=S[tb].find(x=>x.id===id);
  const dep=t==='sec'?(S.bens.some(b=>b.local_id===id)||(S.gerencias||[]).some(g=>g.secretaria_id===id)):t==='ger'?(S.bens.some(b=>b.gerencia_id===id)||(S.equipamentos||[]).some(e=>e.gerencia_id===id)):S.bens.some(b=>b.equipamento_id===id);

function renderFila(){const w=$('#fila');if(!w)return;if(leitura!=='lote'){w.innerHTML='';return}

function onCode(code){code=(code||'').trim();if(!code)return;const n=Date.now();if(lastScan.c===code&&n-lastScan.t<3000)return;lastScan={c:code,t:n};

async function conf(id,move){
  const b0=S.bens.find(x=>x.id===id);

  if(isAppOnline){
    try{
      if(modo==='inv'&&!curConf)curConf=await Repo.rpc('iniciar_conferencia',{p_local:invLocal,p_tipo:'Inventário'});

async function confOffline(id,move,silent=false){
  const b=S.bens.find(x=>x.id===id);
  if(!b)return;
  const nowIso=new Date().toISOString();
  const oldLocal=b.local_id;
  const newLocal=move?invLocal:oldLocal;
  const resTipo=move?'Movido':(invLocal&&oldLocal&&oldLocal!==invLocal?'Local divergente':'Presente');

  if(modo==='inv'){
    if(!curConf||!String(curConf).startsWith('off_')){
      curConf='off_'+uid();
      const newConf={
        id:curConf,
        local_id:invLocal,
        tipo:'Inventário',
        usuario_email:ME.email,
        iniciada_em:nowIso,
        finalizada_em:null,
        marcar_faltantes:false,
        total_esperado:S.bens.filter(x=>x.local_id===invLocal&&x.status!=='Baixado').length,
        is_offline:true,
        itens:[]
      };
      saveOfflineConference(newConf);
    }
    if(!sess.includes(id))sess.push(id);

    const offConf=getOfflineConferences().find(c=>c.id===curConf);
    if(offConf){
      const itIdx=offConf.itens.findIndex(it=>it.bem_id===id);
      const itData={id:uid(),conferencia_id:curConf,bem_id:id,resultado:resTipo,local_encontrado_id:invLocal||oldLocal,data:nowIso,mover:!!move};
      if(itIdx>=0)offConf.itens[itIdx]=itData;else offConf.itens.push(itData);
      saveOfflineConference(offConf);
    }
  }else{
    const avId='off_'+uid();
    const avConf={
      id:avId,
      local_id:newLocal,
      tipo:'Avulsa',
      usuario_email:ME.email,
      iniciada_em:nowIso,
      finalizada_em:nowIso,
      marcar_faltantes:false,
      total_esperado:1,
      is_offline:true,
      itens:[{id:uid(),conferencia_id:avId,bem_id:id,resultado:resTipo,local_encontrado_id:invLocal||oldLocal,data:nowIso,mover:!!move}]
    };
    saveOfflineConference(avConf);
  }

  b.verificado_em=nowIso;
  if(move)b.local_id=invLocal;
  if(b.status==='Não localizado')b.status='Ativo';
  saveCacheData(S);
  mergeOfflineConferencesIntoState();
  updateOnlineBadge();

  if(!silent){
    $('#res').innerHTML=`<div class="card ok">✔ <b>${esc(b.tombo)}</b> conferido <b>offline</b> (${resTipo}) em ${new Date(nowIso).toLocaleString('pt-BR')}. Salvo no aparelho para envio futuro.</div>`;
  }
}

async function finalizarInv(){
  if(fila.length&&!confirm(`Há ${fila.length} bem(ns) na fila ainda não confirmados. Finalizar assim mesmo? Eles ficarão como faltantes.`))return;
  if(!sess.length&&!confirm('Nenhum bem foi conferido. Finalizar mesmo assim (todos ficarão como faltantes)?'))return;
  const mk=$('#mk')&&$('#mk').checked;

  if(isAppOnline){
    try{
      if(!curConf)curConf=await Repo.rpc('iniciar_conferencia',{p_local:invLocal,p_tipo:'Inventário'});
      await Repo.rpc('finalizar_conferencia',{p_conf:curConf,p_marcar:mk});
      const id=curConf;curConf=null;sess=[];await reload();$('#res').innerHTML='';invList();goConf=true;showConf(id);
      return;
    }catch(e){
      if(isNetworkError(e)){
        await finalizarInvOffline();
        return;
      }
      alert('Erro ao finalizar inventário no servidor: '+(e.message||e));
    }
  }else{
    await finalizarInvOffline();
  }
}

async function finalizarInvOffline(){
  const mk=!!($('#mk')&&$('#mk').checked);
  const nowIso=new Date().toISOString();

  if(!curConf||!String(curConf).startsWith('off_')){
    curConf='off_'+uid();
    const newConf={
      id:curConf,
      local_id:invLocal,
      tipo:'Inventário',
      usuario_email:ME.email,
      iniciada_em:nowIso,
      finalizada_em:null,
      marcar_faltantes:false,
      total_esperado:S.bens.filter(x=>x.local_id===invLocal&&x.status!=='Baixado').length,
      is_offline:true,
      itens:[]
    };
    saveOfflineConference(newConf);
  }

  const offConf=getOfflineConferences().find(c=>c.id===curConf);
  if(!offConf)return;

  const esp=S.bens.filter(b=>b.local_id===invLocal&&b.status!=='Baixado');
  const conferidosSet=new Set(offConf.itens.map(i=>i.bem_id));

  esp.forEach(b=>{
    if(!conferidosSet.has(b.id)){
      offConf.itens.push({
        id:uid(),
        conferencia_id:curConf,
        bem_id:b.id,
        resultado:'Faltante',
        local_encontrado_id:null,
        data:nowIso,
        mover:false
      });
      if(mk){
        b.status='Não localizado';
      }
    }
  });

  offConf.finalizada_em=nowIso;
  offConf.marcar_faltantes=mk;
  saveOfflineConference(offConf);
  saveCacheData(S);
  mergeOfflineConferencesIntoState();
  updateOnlineBadge();

  const id=curConf;
  curConf=null;sess=[];fila=[];
  $('#res').innerHTML=`<div class="card ok">✔ <b>Inventário finalizado offline com sucesso!</b><br>Os dados foram salvos neste aparelho. Quando reconectar à internet, envie pelo botão <b>Sincronizar</b>.</div>`;
  invList();
  goConf=true;
  showConf(id);
}

const confTot=c=>{const it=(S.conferencia_itens||[]).filter(i=>i.conferencia_id===c.id),n=r=>it.filter(i=>i.resultado===r).length;return{ok:it.length-n('Faltante'),falt:n('Faltante'),div:n('Local divergente')+n('Movido'),it}};

async function mudarLocalConfOffline(id){
  const conf = getOfflineConferences().find(c => c.id === id);
  if(!conf) return;
  const permitidos = adm() ? S.locais : userLocais();
  if(!permitidos.length){
    alert('Seu usuário não possui nenhuma secretaria atribuída. Solicite a um administrador para vincular seu acesso na tela de Usuários.');
    return;
  }
  const novoLocal = await dialogAlterarLocalConf(conf, permitidos);
  if(novoLocal && novoLocal !== conf.local_id){
    conf.local_id = novoLocal;
    conf.total_esperado = S.bens.filter(x => x.local_id === novoLocal && x.status !== 'Baixado').length;
    (conf.itens || []).forEach(it => {
      if(it.resultado === 'Presente') it.local_encontrado_id = novoLocal;
    });
    saveOfflineConference(conf);
    mergeOfflineConferencesIntoState();
    showConf(id);
    alert(`Local atualizado com sucesso para: ${L(novoLocal)}.\nAgora você pode sincronizar.`);
  }
}

async function ensureOnlineAuth(interactive = false){
  if(!isAppOnline) return false;
  try {
    const { data: { session }, error } = await sb.auth.getSession();
    if(session && session.user && (!ME || session.user.id === ME.id)){
      if(session.expires_at && (session.expires_at * 1000 - Date.now() < 60000)){
        const refreshed = await sb.auth.refreshSession().catch(()=>null);
        if(refreshed && refreshed.data && refreshed.data.session) return true;
      } else {
        return true;
      }
    } else {
      const refreshed = await sb.auth.refreshSession().catch(()=>null);
      if(refreshed && refreshed.data && refreshed.data.session && (!ME || refreshed.data.session.user.id === ME.id)){
        return true;
      }
    }
  } catch(e) {
    console.warn('Erro ao verificar sessão Supabase:', e);
  }

  if(!interactive) return false;

  return new Promise((resolve) => {
    const email = (ME && ME.email) || '';
    let d = $('#dlgAuth');
    if(!d){
      d = document.createElement('dialog');
      d.id = 'dlgAuth';
      d.style.zIndex = '9999';
      document.body.appendChild(d);
    }
    d.innerHTML = `
      <div style="padding:4px">
        <h3 style="margin:0 0 8px">🔒 Reautenticação necessária</h3>
        <p style="font-size:13.5px;color:var(--mut);margin:0 0 12px">
          Sua conexão com a internet foi restabelecida. Para sincronizar o inventário com segurança no banco de dados, confirme a senha de <b>${esc(email)}</b>:
        </p>
        <div style="margin-bottom:12px">
          <label>Senha de acesso</label>
          <input type="password" id="syncPw" placeholder="Digite sua senha" autocomplete="current-password">
          <p id="syncPwErr" class="err" style="margin:6px 0 0;font-size:13px"></p>
        </div>
        <div class="row" style="justify-content:flex-end;gap:8px">
          <button id="btnCancelSyncPw">Cancelar</button>
          <button class="pri" id="syncPwBtn">Entrar e Sincronizar</button>
        </div>
      </div>
    `;
    const doLogin = async () => {
      const pw = ($('#syncPw').value || '').trim();
      if(!pw){
        $('#syncPwErr').textContent = 'Informe sua senha.';
        return;
      }
      const btn = $('#syncPwBtn');
      if(btn){ btn.disabled = true; btn.textContent = 'Autenticando…'; }
      $('#syncPwErr').textContent = '';
      try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
        if(error) throw error;
        const { data: perfil } = await sb.from('perfis').select('*').eq('id', data.user.id).maybeSingle();
        if(perfil && perfil.ativo){
          ME = perfil;
          setActiveProfile(perfil);
          const h = await hashCred(email, pw);
          saveOfflineUser(email, h, perfil);
        }
        d.close();
        resolve(true);
      } catch(err) {
        if(btn){ btn.disabled = false; btn.textContent = 'Entrar e Sincronizar'; }
        $('#syncPwErr').textContent = 'Erro ao autenticar: ' + (err.message || err);
      }
    };
    $('#btnCancelSyncPw').onclick = () => { d.close(); resolve(false); };
    $('#syncPwBtn').onclick = doLogin;
    $('#syncPw').onkeydown = e => { if(e.key === 'Enter') doLogin(); };
    d.showModal();
    setTimeout(() => { const el = $('#syncPw'); if(el) el.focus(); }, 100);
  });
}

async function saveItem(cid,iid){const i=S.conferencia_itens.find(x=>x.id===iid);await Repo.upsert('conferencia_itens',{...i,resultado:$('#ir').value,obs:$('#io').value.trim()||null});await reload();showConf(cid)}
async function delItem(cid,iid){if(!confirm('Excluir este item da conferência?'))return;await Repo.remove('conferencia_itens',iid);await reload();showConf(cid)}
async function delConf(id){
  const c=S.conferencias.find(x=>x.id===id);
  if(c&&c.is_offline)return delOfflineConf(id);
  if(!confirm('Excluir esta conferência e todos os seus itens? As datas de última conferência dos bens não serão alteradas.'))return;

function delOfflineConf(id){
  if(!confirm('Excluir esta conferência offline pendente? Os registros dela salvos no aparelho serão apagados.'))return;
  removeOfflineConference(id);
  mergeOfflineConferencesIntoState();
  updateOnlineBadge();
  $('#dlg').close();
  if(view==='conf')confs();else render();
}

async function syncOfflineConferences(targetId=null){
  if(isSyncing)return;
  const list=getOfflineConferences();
  if(!list.length){
    alert('Nenhuma conferência offline pendente de sincronização.');
    return;
  }
  const online=await checkRealConnection();
  if(!online){
    alert('Sem conexão com a internet ou servidor indisponível. Conecte-se e tente novamente.');
    return;
  }

  // 1. Garante que o Supabase possui sessão autenticada ativa com JWT válido
  const authOk = await ensureOnlineAuth(true);
  if(!authOk){
    return;
  }

  isSyncing=true;
  updateOnlineBadge();

  const toSync=targetId?list.filter(c=>c.id===targetId):[...list];
  let confsOk=0,itensOk=0,falhas=0,lastError='';

  for(const conf of toSync){
    try{
      // 2. Valida se o usuário tem permissão para o local desta conferência
      const permitidos = adm() ? S.locais : userLocais();
      let localId = conf.local_id;

      if(!permitidos.some(l => l.id === localId)){
        const nomeAntigo = L(localId);
        if(!permitidos.length){
          throw new Error(`Seu usuário (${ME.email}) não possui permissão para o local "${nomeAntigo}" e nenhuma secretaria foi vinculada ao seu perfil. Solicite a um administrador para liberar seu acesso.`);
        }
        const novoLocal = await dialogAlterarLocalConf(conf, permitidos);
        if(!novoLocal){
          throw new Error(`Sincronização cancelada para "${nomeAntigo}": local sem permissão.`);
        }
        localId = novoLocal;
        conf.local_id = novoLocal;
        (conf.itens || []).forEach(it => { if(it.resultado === 'Presente') it.local_encontrado_id = novoLocal; });
        saveOfflineConference(conf);
      }

      if(!localId){
        throw new Error('Local da conferência não definido.');
      }

      const serverConfId=await Repo.rpc('iniciar_conferencia',{
        p_local:localId,
        p_tipo:conf.tipo||'Inventário'
      });
      if(!serverConfId)throw new Error('Falha ao iniciar conferência no banco.');

      const presentes=(conf.itens||[]).filter(i=>i.resultado!=='Faltante');
      for(const it of presentes){
        await Repo.rpc('conferir_bem',{
          p_bem:it.bem_id,
          p_local:localId,
          p_mover:!!it.mover,
          p_conf:serverConfId
        });
        itensOk++;
      }

      if(conf.finalizada_em){
        await Repo.rpc('finalizar_conferencia',{
          p_conf:serverConfId,
          p_marcar:!!conf.marcar_faltantes
        });
      }

      removeOfflineConference(conf.id);
      confsOk++;
    }catch(e){
      console.error('Erro na sincronização:',e);
      falhas++;
      lastError=e.message||String(e);
      break;
    }
  }

  isSyncing=false;
  await refresh();

  if(confsOk>0&&falhas===0){
    alert(`🎉 Sincronização concluída com sucesso!\n\n${confsOk} conferência(s) e ${itensOk} item(ns) gravados no banco de dados.`);
  }else if(confsOk>0&&falhas>0){
    alert(`Sincronização parcial:\n${confsOk} conferência(s) enviada(s), mas ocorreu erro na seguinte:\n${lastError}\n\nOs itens pendentes continuam salvos no aparelho.`);
  }else{
    alert(`Não foi possível sincronizar:\n${lastError||'Erro desconhecido'}\n\nOs dados continuam salvos no aparelho.`);
  }

  if(view==='conf')confs();
}

async function autoSyncIfOnline(){
  const list=getOfflineConferences();
  if(list.length&&!isSyncing&&isAppOnline){
    const authOk = await ensureOnlineAuth(false);
    if(authOk){
      console.log('Online detectado e autenticado: tentando sincronizar conferências offline pendentes...');
      await syncOfflineConferences();
    }
  }
}

/* ======== ETIQUETAS ======== */
let FL={l:'',g:'',e:''};
function labels(){
  const r=S.bens.filter(b=>b.status!=='Baixado'&&matchEst(b,FL));
  const total=r.length,totalPages=Math.max(1,Math.ceil(total/perLabels));
  pageLabels=Math.min(Math.max(1,pageLabels),totalPages);
  const slice=r.slice((pageLabels-1)*perLabels,pageLabels*perLabels);
  $('#main').innerHTML=`<div class="card"><div class="g2">${cascata('el',{s:FL.l,g:FL.g,e:FL.e},FOPT)}</div>
  <div class="row" style="margin-top:10px;gap:8px"><button class="pri" id="ep">🖨 Imprimir selecionadas</button><button class="sm" onclick="toggleSelLabels(true)">Marcar todas da página</button><button class="sm" onclick="toggleSelLabels(false)">Desmarcar todas</button></div>
  <p class="mut" style="margin:8px 0 0;font-size:13px">${total} bem(ns) encontrado(s).</p></div>
  <div class="card"><div class="labels" id="lb">${slice.map(b=>`<label class="lbl" style="cursor:pointer;margin:0"><input type="checkbox" value="${b.id}" checked style="width:auto"><div class="qr">${qrSvg(b.tombo)}</div><b>${esc(b.tombo)}</b>${esc(b.descricao).slice(0,32)}</label>`).join('')||'<span class="mut">Sem bens.</span>'}</div>
  ${paginacao(total,pageLabels,perLabels,'labels')}</div>`;
  $('#els').onchange=e=>{FL.l=e.target.value;FL.g='';FL.e='';pageLabels=1;labels()};
  $('#elg').onchange=e=>{FL.g=e.target.value;FL.e='';pageLabels=1;labels()};
  $('#ele').onchange=e=>{FL.e=e.target.value;pageLabels=1;labels()};
  $('#ep').onclick=()=>{const ids=[...document.querySelectorAll('#lb input:checked')].map(i=>i.value);ids.length&&printLabels(ids)}}

/* ======== RELATÓRIOS E HISTÓRICO DE MOVIMENTAÇÕES ======== */
const txtEst=(s,g,e)=>[s?L(s):'Todas as secretarias',g?(g==='_'?'Sem gerência definida':GN(g)):'Todas as gerências',e?EN(e):'Todos os equipamentos / unidades'].join(' › ');
function relatorio(titulo,sub,cols,rows,rodape){
  $('#printarea').innerHTML=`<div class="rep"><h2>${esc(titulo)}</h2><div style="color:#444">${esc(sub)}</div>
  <table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c??'')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}">Nenhum registro.</td></tr>`}</table>
  <div style="margin-top:12px;font-size:11px;color:#333">${esc(rodape||'')}</div><div style="margin-top:6px;font-size:10px;color:#555">Emitido em ${new Date().toLocaleString('pt-BR')} por ${esc(ME.email)}</div></div>`;printNow(titulo)}
function imprimirBens(){const r=[...filtrados()].sort((a,b)=>(P(a.local_id,a.gerencia_id,a.equipamento_id)+'|'+a.tombo).localeCompare(P(b.local_id,b.gerencia_id,b.equipamento_id)+'|'+b.tombo,'pt-BR',{numeric:true}));
  const sub=[txtEst(F.l,F.g,F.e),F.c?(F.c==='_sem_'?'Sem categoria':'Categoria: '+F.c):'',F.s?'Status: '+F.s:'',F.q?'Busca: '+F.q:''].filter(Boolean).join(' · ');
  relatorio('Relatório de bens patrimoniais',sub,
    ['Tombo','Descrição','Categoria','Secretaria','Gerência','Equipamento / Unidade','Status','Valor atual'],
    r.map(b=>[b.tombo,b.descricao,b.categoria||'Sem categoria',b.local_id?L(b.local_id):'—',GN(b.gerencia_id)||'—',EN(b.equipamento_id)||'—',b.status,b.status==='Baixado'?'—':brl(deprec(b).atual)]),
    `Total: ${r.length} bem(ns) · Valor contábil: ${brl(r.reduce((s,b)=>s+(b.status==='Baixado'?0:deprec(b).atual),0))}`)}
let FH={q:'',t:'',l:'',g:'',e:'',de:'',ate:''};
function hMov(){const bem=id=>S.bens.find(x=>x.id===id)||{},q=FH.q.toLowerCase(),lado=(s,g,e)=>matchEst({local_id:s,gerencia_id:g,equipamento_id:e},FH);
  return [...(S.movimentacoes||[])].filter(m=>{const b=bem(m.bem_id);if(q&&!((b.tombo||'')+(b.descricao||'')).toLowerCase().includes(q))return false;
    if(FH.t&&m.tipo!==FH.t)return false;const d=new Date(m.data).toLocaleDateString('sv-SE');if(FH.de&&d<FH.de)return false;if(FH.ate&&d>FH.ate)return false;
    return lado(m.de_local_id,m.de_gerencia_id,m.de_equipamento_id)||lado(m.para_local_id,m.para_gerencia_id,m.para_equipamento_id)}).sort((a,b)=>a.data<b.data?1:-1)}
const lado=(s,g,e)=>s?P(s,g,e):'—';
function hist(){
  const bem=id=>S.bens.find(x=>x.id===id)||{},r=hMov(),tipos=[...new Set((S.movimentacoes||[]).map(m=>m.tipo).filter(Boolean))].sort();
  const total=r.length,totalPages=Math.max(1,Math.ceil(total/perMov));
  pageMov=Math.min(Math.max(1,pageMov),totalPages);
  const slice=r.slice((pageMov-1)*perMov,pageMov*perMov);
  $('#main').innerHTML=`<div class="card"><div class="row"><input id="hq" placeholder="Buscar tombo ou descrição…" value="${esc(FH.q)}"><select id="ht"><option value="">Todos os tipos</option>${tipos.map(t=>`<option ${FH.t===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
  <div class="g2" style="margin-top:8px">${cascata('hh',{s:FH.l,g:FH.g,e:FH.e},FOPT)}<div><label>De</label><input id="hde" type="date" value="${FH.de}"></div><div><label>Até</label><input id="hate" type="date" value="${FH.ate}"></div></div>
  <div class="row" style="margin-top:8px"><button onclick="imprimirHist()">🖨 Imprimir / PDF</button></div>
  <p class="mut" style="margin:8px 0 0;font-size:13px">${total} movimentação(ões). O filtro de estrutura considera origem ou destino.</p></div>
  <div class="card tw"><table><tr><th>Data e hora</th><th>Tombo</th><th>Bem</th><th>Tipo</th><th>Origem</th><th>Destino</th><th>Usuário</th><th>Obs.</th>${adm()?'<th></th>':''}</tr>
  ${slice.map(m=>`<tr><td>${fdt(m.data)}</td><td><b>${esc(bem(m.bem_id).tombo)}</b></td><td style="white-space:normal">${esc(bem(m.bem_id).descricao)}</td><td>${esc(m.tipo)}</td><td style="white-space:normal;min-width:170px">${esc(lado(m.de_local_id,m.de_gerencia_id,m.de_equipamento_id))}</td><td style="white-space:normal;min-width:170px">${esc(lado(m.para_local_id,m.para_gerencia_id,m.para_equipamento_id))}</td><td>${esc(m.usuario_email||'—')}</td><td style="white-space:normal">${esc(m.obs)}</td>${adm()?`<td><button class="sm bad" onclick="delMov('${m.id}')">Excluir</button></td>`:''}</tr>`).join('')||'<tr><td colspan="'+(adm()?9:8)+'" class="mut">Nenhuma movimentação.</td></tr>'}</table>
  ${paginacao(total,pageMov,perMov,'mov')}</div>`;
  $('#hq').oninput=e=>{FH.q=e.target.value;pageMov=1;clearTimeout(hist.t);hist.t=setTimeout(()=>{hist();const i=$('#hq');i.focus();i.setSelectionRange(FH.q.length,FH.q.length)},250)};
  $('#ht').onchange=e=>{FH.t=e.target.value;pageMov=1;hist()};
  $('#hhs').onchange=e=>{FH.l=e.target.value;FH.g='';FH.e='';pageMov=1;hist()};$('#hhg').onchange=e=>{FH.g=e.target.value;FH.e='';pageMov=1;hist()};$('#hhe').onchange=e=>{FH.e=e.target.value;pageMov=1;hist()};
  $('#hde').onchange=e=>{FH.de=e.target.value;pageMov=1;hist()};$('#hate').onchange=e=>{FH.ate=e.target.value;pageMov=1;hist()}}
async function delMov(id){
  if(!adm())return;
  if(!confirm('Excluir este registro de movimentação do histórico?'))return;
  await Repo.remove('movimentacoes',id);
  S.movimentacoes=await Repo.list('movimentacoes');
  hist();
}
