<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b2330;--mut:#6b7686;--bd:#e1e5ec;--pri:#1f6feb;--ok:#1a7f4b;--warn:#b7791f;--bad:#c93636}
@media (prefers-color-scheme:dark){:root{--bg:#10141b;--card:#181e28;--tx:#e6eaf1;--mut:#8b96a8;--bd:#283040;--pri:#4c8dff;--ok:#3ecf8e;--warn:#e0a84a;--bad:#ff6b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header,main{max-width:1100px;margin:auto;padding:0 16px}
header{padding-top:14px}h1{font-size:19px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}nav button{white-space:nowrap}
main{padding-bottom:40px}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 13px;cursor:pointer}
button.on,button.pri{background:var(--pri);border-color:var(--pri);color:#fff}button.sm{padding:4px 9px;font-size:13px}button.bad{color:var(--bad)}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi b{display:block;font-size:24px}.kpi span{color:var(--mut);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 150px}.row>button{flex:0 0 auto}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:500;font-size:12.5px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--bad)}.mut{color:var(--mut)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(680px,94vw);padding:18px;max-height:92vh}
dialog::backdrop{background:#0008}
#reader{width:100%;max-width:420px;margin:auto;border-radius:10px;overflow:hidden}
.qr svg{width:100%;height:auto;display:block}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.lbl{border:1px dashed var(--mut);border-radius:6px;padding:8px;text-align:center;font-size:11px;background:#fff;color:#000}
.lbl .qr{width:96px;margin:0 auto 4px}.lbl b{display:block;font-size:12px}
.foto{display:block;width:100%;max-width:320px;height:240px;object-fit:cover;margin:0 auto 10px;border-radius:10px;border:1px solid var(--bd);cursor:zoom-in}
#zoom{background:transparent;border:0;padding:0;max-width:96vw;max-height:96vh;overflow:visible}#zoom::backdrop{background:#000d}
#zoom img{display:block;max-width:96vw;max-height:88vh;object-fit:contain;margin:auto;border-radius:8px;cursor:zoom-out}#zoom p{color:#ddd;text-align:center;font-size:13px;margin:8px 0 0}
#login{max-width:360px;margin:12vh auto}
#printarea{display:none}@media print{body>*:not(#printarea){display:none!important}#printarea{display:block;color:#000;background:#fff}@page{margin:14mm}}
.rep{font:12px/1.4 Arial,sans-serif;color:#000}.rep h2{margin:0 0 2px;font-size:19px}.rep table{border-collapse:collapse;width:100%;margin-top:10px}
.rep th,.rep td{border:1px solid #888;padding:4px 6px;text-align:left;white-space:normal;color:#000;font-size:12px}.rep th{background:#eee}
.rep tr{page-break-inside:avoid}.sig{display:flex;gap:50px;margin-top:70px}.sig div{flex:1;border-top:1px solid #000;text-align:center;padding-top:4px}
</style>

<script>window.addEventListener("error",function(e){var a=document.getElementById("app");if(a&&!window.__iniciou)a.innerHTML='<div style="padding:22px;font:15px system-ui,sans-serif;color:#e04b4b"><b>Erro ao iniciar o sistema:</b><br>'+(e.message||"desconhecido")+'<br><br>Verifique a internet e abra o app novamente.</div>'});</script>
<dialog id="dlg"></dialog>
<dialog id="zoom"></dialog>
<div id="printarea"></div>

<script>
if(typeof supabase==='undefined'||typeof qrcode==='undefined'){document.getElementById('app').innerHTML='<div style="padding:22px;font:15px system-ui,sans-serif;color:#e04b4b"><b>Sem conexão com a internet.</b><br>Não foi possível carregar as bibliotecas do sistema. Conecte-se e abra o app novamente.</div>';throw new Error('bibliotecas não carregadas')}
window.__iniciou=true;
/* ======== CONFIGURAÇÃO SUPABASE (a chave publishable é pública; NUNCA coloque a senha do banco aqui) ======== */
const SUPABASE_URL='https://qprpkrvcczxwtroztbbp.supabase.co';
const SUPABASE_KEY='sb_publishable_qjmUWIbCrjeA6Z2M9I5-Cg_j_W8QJUT';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const BUCKET='bens-fotos';

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID();
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt=v=>v?new Date(String(v).length===10?v+'T12:00:00':v).toLocaleDateString('pt-BR'):'—';
const today=()=>new Date().toISOString().slice(0,10);
const inDays=n=>Math.ceil((new Date(String(n).slice(0,10)+'T12:00:00')-Date.now())/864e5);
const ESTADOS=['Novo','Bom','Regular','Ruim','Inservível'],STATUS=['Ativo','Em manutenção','Emprestado','Baixado','Não localizado'],MOTIVOS=['Venda','Doação','Sucata','Perda/Furto','Outro'];
const isNative=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const b64=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(blob)});
async function salvarArquivo(nome,blob){
  if(isNative()){const{Filesystem,Share}=Capacitor.Plugins;const w=await Filesystem.writeFile({path:nome,data:await b64(blob),directory:'CACHE'});await Share.share({title:nome,url:w.uri,dialogTitle:'Salvar ou compartilhar'});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;a.click()}
function printNow(nome){setTimeout(()=>{if(isNative())Capacitor.Plugins.PrintNative.print({name:nome});else window.print()},150)}
function zoomFoto(src){const z=$('#zoom');z.innerHTML=`<img src="${esc(src)}" alt="Foto ampliada"><p>Toque ou clique para fechar</p>`;z.showModal()}
$('#zoom').addEventListener('click',()=>$('#zoom').close());
let AC=null,somOn=true,vibOn=true;try{somOn=localStorage.getItem('pat_som')!=='0';vibOn=localStorage.getItem('pat_vib')!=='0'}catch(e){}
function audioInit(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function bip(ok=true){
  try{if(vibOn&&navigator.vibrate)navigator.vibrate(ok?80:[80,60,120])}catch(e){}
  if(!somOn)return;
  try{audioInit();if(!AC)return;const t0=AC.currentTime,tons=ok?[[1800,0,.14]]:[[380,0,.16],[280,.2,.22]];
    tons.forEach(([f,d,l])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'sine':'square';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.4,t0+d+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d+l);
      o.connect(g);g.connect(AC.destination);o.start(t0+d);o.stop(t0+d+l+.02)})}catch(e){}}
let goConf=false;
$('#dlg').addEventListener('close',async()=>{try{await reload()}catch(e){}if(!ME)return;if(goConf){goConf=false;view='conf';render()}else if(view==='conf')render()});
window.addEventListener('error',e=>{alert('Erro: '+e.message)});
window.addEventListener('unhandledrejection',e=>{alert('Erro: '+(e.reason?.message||e.reason));});

/* ======== CAMADA DE DADOS ======== */
const Repo={
  async list(t){const{data,error}=await sb.from(t).select('*');if(error)throw error;return data},
  async upsert(t,r,oc){const{data,error}=await sb.from(t).upsert(r,oc?{onConflict:oc}:{}).select();if(error)throw error;return data},
  async remove(t,id){const{error}=await sb.from(t).delete().eq('id',id);if(error)throw error},
  async rpc(f,a){const{data,error}=await sb.rpc(f,a);if(error)throw error;return data}
};
let S={},ME=null,view='dash',sc=null,sess=[],lastScan={c:'',t:0},modo='consulta',invLocal='',F={q:'',l:'',s:'',g:'',e:''};
const adm=()=>ME?.papel==='admin';
async function refresh(){
  const T=['locais','bens','movimentacoes','manutencoes','baixas','conferencias','conferencia_itens','usuario_locais','gerencias','equipamentos'];S.semEstrutura=false;if(adm())T.push('perfis');
  const r=await Promise.all(T.map(t=>Repo.list(t).catch(e=>{if(t.startsWith('conferencia')||t==='usuario_locais')return [];if(t==='gerencias'||t==='equipamentos'){S.semEstrutura=true;return []}throw e})));T.forEach((t,i)=>S[t]=r[i]);render()}
const L=id=>(S.locais.find(l=>l.id===id)||{}).nome||'— sem local —';
const GN=id=>((S.gerencias||[]).find(x=>x.id===id)||{}).nome,EN=id=>((S.equipamentos||[]).find(x=>x.id===id)||{}).nome;
const P=(s,g,e)=>[s?L(s):'— sem secretaria —',g&&GN(g),e&&EN(e)].filter(Boolean).join(' › ');
const pos=b=>({s:b.local_id,g:b.gerencia_id,e:b.equipamento_id});
const fdt=v=>v?new Date(v).toLocaleString('pt-BR'):'—';
const optH=(arr,sel,ph,extra='')=>`<option value="">${ph}</option>${extra}`+arr.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.nome)}${x.ativo===false?' (inativa)':''}</option>`).join('');
const secsDe=(sel,all)=>S.locais.filter(l=>all||l.ativo!==false||l.id===sel);
const gersDe=(sec,sel,all)=>(S.gerencias||[]).filter(g=>g.secretaria_id===sec&&(all||g.ativo!==false||g.id===sel));
const eqsDe=(ger,sel,all)=>(S.equipamentos||[]).filter(e=>e.gerencia_id===ger&&(all||e.ativo!==false||e.id===sel));
const exOpt=s=>`<option value="_" ${s==='_'?'selected':''}>(sem gerência definida)</option>`;
const PH0=['— selecione —','— nenhuma —','— nenhum —'];
function cascata(p,v={},o={}){const ph=o.ph||PH0;
  return `<div><label>Secretaria</label><select id="${p}s" name="local_id">${optH(secsDe(v.s,o.todos),v.s,ph[0])}</select></div>
  <div><label>Gerência</label><select id="${p}g" name="gerencia_id">${optH(gersDe(v.s,v.g,o.todos),v.g,ph[1],o.sem?exOpt(v.g):'')}</select></div>
  <div><label>Equipamento / Unidade</label><select id="${p}e" name="equipamento_id">${optH(eqsDe(v.g,v.e,o.todos),v.e,ph[2])}</select></div>`}
function bindCascata(p){const s=$('#'+p+'s'),g=$('#'+p+'g'),e=$('#'+p+'e');
  s.onchange=()=>{g.innerHTML=optH(gersDe(s.value),'',PH0[1]);e.innerHTML=optH([],'',PH0[2])};
  g.onchange=()=>{e.innerHTML=optH(eqsDe(g.value),'',PH0[2])}}

const nextTombo=()=>'PAT-'+String(S.bens.reduce((m,b)=>Math.max(m,parseInt((b.tombo||'').replace(/\D/g,''))||0),0)+1).padStart(6,'0');
const mov=(b,tipo,de,para,obs)=>{const r={bem_id:b.id,tipo,de_local_id:(de&&de.s)||null,para_local_id:(para&&para.s)||null,obs:obs||null};
  if(!S.semEstrutura){r.de_gerencia_id=(de&&de.g)||null;r.de_equipamento_id=(de&&de.e)||null;r.para_gerencia_id=(para&&para.g)||null;r.para_equipamento_id=(para&&para.e)||null}
  return Repo.upsert('movimentacoes',r)};
const fotoUrl=p=>p?sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl:'';
function deprec(b){const v=+b.valor||0,r=+b.valor_residual||0,n=+b.vida_util_anos||0;
  if(!n||!b.data_aquisicao)return{atual:v,acum:0};
  const anos=Math.max(0,(Date.now()-new Date(b.data_aquisicao))/3.15576e10),acum=Math.min(v-r,(v-r)/n*anos);return{atual:v-acum,acum}}

/* ======== AUTH ======== */
async function boot(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){ME=null;return loginView()}
  const getP=()=>sb.from('perfis').select('*').eq('id',session.user.id).maybeSingle();
  let{data,error}=await getP();
  if(!data){await sb.rpc('garantir_perfil');({data,error}=await getP())}
  if(!data||!data.ativo){const why=error?'Erro do banco: '+error.message:(data?'Sua conta está desativada.':'Perfil não encontrado para '+session.user.email+'.');
    $('#app').innerHTML=`<div class="card" id="login"><p>Seu acesso ainda não foi liberado por um administrador.</p><p class="err" style="font-size:13px">${esc(why)}</p><button onclick="sb.auth.signOut()">Sair</button></div>`;return}
  ME=data;shell();await refresh()}
function loginView(msg=''){
  $('#app').innerHTML=`<div class="card" id="login"><h1>📦 Controle de Patrimônio</h1><p class="mut">Entre com sua conta.</p>
  <label>E-mail</label><input id="em" type="email"><label style="margin-top:8px">Senha</label><input id="pw" type="password">
  <p class="${msg.startsWith('✔')?'ok':'err'}">${esc(msg)}</p>
  <div class="row"><button class="pri" id="bi">Entrar</button><button id="bc">Criar conta</button></div></div>`;
  const cred=()=>({email:$('#em').value.trim(),password:$('#pw').value});
  $('#bi').onclick=async()=>{const{error}=await sb.auth.signInWithPassword(cred());if(error)loginView(error.message)};
  $('#bc').onclick=async()=>{const{data,error}=await sb.auth.signUp(cred());if(error)return loginView(error.message);
    if(!data.session)loginView('✔ Conta criada. Confirme o e-mail (se exigido) e entre.')};
  $('#pw').onkeydown=e=>{if(e.key==='Enter')$('#bi').click()}}
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')setTimeout(boot,0)});
function shell(){
  const nav=[['dash','Painel'],['bens','Bens'],['scan','Leitor / Inventário'],['conf','Conferências'],['labels','Etiquetas QR'],['locais','Estrutura'],['hist','Movimentações']];if(adm())nav.push(['users','Usuários']);
  $('#app').innerHTML=`<header><div class="top"><h1>📦 Patrimônio</h1><div class="mut" style="font-size:13px">${esc(ME.email)} · <span class="tag">${ME.papel}</span> <button class="sm" onclick="sb.auth.signOut()">Sair</button></div></div>
  <nav id="nav">${nav.map(n=>`<button data-v="${n[0]}">${n[1]}</button>`).join('')}</nav></header><main id="main"></main>`;
  $('#nav').onclick=e=>{const v=e.target.dataset.v;if(v){view=v;render()}}}
function render(){
  if(!ME||!$('#main'))return;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  if(view!=='scan')stopScan();({dash,bens,locais,scan,conf:confs,labels,users,hist})[view]()}

/* ======== QR ======== */
function qrSvg(t){const q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag(4,0)}
function showQR(id){const b=S.bens.find(x=>x.id===id);
  $('#dlg').innerHTML=`<div style="text-align:center"><div class="qr" style="width:240px;margin:auto;background:#fff;padding:10px;border-radius:8px">${qrSvg(b.tombo)}</div><h3>${esc(b.tombo)}</h3><p class="mut">${esc(b.descricao)}</p>
  <div class="row" style="justify-content:center"><button class="pri" onclick="printLabels(['${b.id}'])">Imprimir etiqueta</button><button onclick="$('#dlg').close()">Fechar</button></div></div>`;if(!$('#dlg').open)$('#dlg').showModal()}
function printLabels(ids){
  $('#printarea').innerHTML='<div class="labels">'+ids.map(id=>{const b=S.bens.find(x=>x.id===id);return `<div class="lbl"><div class="qr">${qrSvg(b.tombo)}</div><b>${esc(b.tombo)}</b>${esc(b.descricao).slice(0,40)}</div>`}).join('')+'</div>';
  printNow('Etiquetas')}

/* ======== PAINEL + ALERTAS ======== */
function dash(){
  const ativos=S.bens.filter(b=>b.status!=='Baixado'),vt=ativos.reduce((s,b)=>s+deprec(b).atual,0),dep=ativos.reduce((s,b)=>s+deprec(b).acum,0);
  const man=S.manutencoes.filter(m=>m.status==='Agendada'&&inDays(m.data)<=30).sort((a,b)=>a.data<b.data?-1:1);
  const gar=ativos.filter(b=>b.garantia_ate&&inDays(b.garantia_ate)<=30).sort((a,b)=>a.garantia_ate<b.garantia_ate?-1:1);
  const porL=S.locais.map(l=>({n:l.nome,c:ativos.filter(b=>b.local_id===l.id).length})),mx=Math.max(1,...porL.map(x=>x.c));
  const semG=ativos.filter(b=>b.local_id&&!b.gerencia_id).length;
  const al=(d)=>{const n=inDays(d);return n<0?`<b class="err">vencido há ${-n}d</b>`:`<b class="warn">em ${n}d</b>`};
  $('#main').innerHTML=`${adm()?'':`<div class="card"><b>Suas secretarias:</b> ${S.locais.map(l=>esc(l.nome)).join(', ')||'<span class="err">nenhum — peça ao administrador para vincular um local ao seu usuário.</span>'}</div>`}<div class="grid"><div class="card kpi"><b>${ativos.length}</b><span>Bens em uso (${S.bens.length-ativos.length} baixados)</span></div>
  <div class="card kpi"><b>${brl(vt)}</b><span>Valor contábil atual</span></div><div class="card kpi"><b>${brl(dep)}</b><span>Depreciação acumulada</span></div>
  <div class="card kpi"><b class="${ativos.some(b=>!b.verificado_em)?'warn':'ok'}">${ativos.filter(b=>!b.verificado_em).length}</b><span>Nunca conferidos</span></div></div>
  <div class="g2"><div class="card"><b>🔧 Manutenções (próx. 30 dias / vencidas)</b>${man.map(m=>{const b=S.bens.find(x=>x.id===m.bem_id)||{};return `<div style="margin-top:7px"><a href="#" onclick="showFicha('${b.id}');return false"><b>${esc(b.tombo)}</b></a> ${esc(m.tipo)} · ${dt(m.data)} ${al(m.data)}</div>`}).join('')||'<p class="mut">Nenhuma pendência.</p>'}</div>
  <div class="card"><b>🛡 Garantias (vencendo / vencidas)</b>${gar.map(b=>`<div style="margin-top:7px"><a href="#" onclick="showFicha('${b.id}');return false"><b>${esc(b.tombo)}</b></a> ${esc(b.descricao).slice(0,26)} · ${dt(b.garantia_ate)} ${al(b.garantia_ate)}</div>`).join('')||'<p class="mut">Nenhuma garantia próxima do vencimento.</p>'}</div></div>
  <div class="card"><b>Bens por secretaria</b>${semG?`<span class="mut" style="font-size:12.5px"> · ${semG} ainda sem gerência definida</span>`:''}${porL.map(x=>`<div style="margin-top:9px"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span>${esc(x.n)}</span><span class="mut" style="flex:0">${x.c}</span></div><div class="bar"><i style="width:${x.c/mx*100}%"></i></div></div>`).join('')}</div>`}

/* ======== BENS ======== */
const FOPT={todos:true,sem:true,ph:['Todas as secretarias','Todas as gerências','Todos os equipamentos']};
const matchEst=(b,f)=>(!f.l||b.local_id===f.l)&&(f.g==='_'?!b.gerencia_id:(!f.g||b.gerencia_id===f.g))&&(!f.e||b.equipamento_id===f.e);
function filtrados(){return S.bens.filter(b=>matchEst(b,F)&&(!F.s||b.status===F.s)&&(!F.q||(b.tombo+b.descricao+(b.serie||'')+(b.responsavel||'')).toLowerCase().includes(F.q.toLowerCase())))}
function bens(){

/* ======== EXPORTAR / IMPORTAR ======== */
const CAMPOS=['tombo','descricao','categoria','marca','modelo','serie','valor','data_aquisicao','vida_util_anos','valor_residual','garantia_ate','estado','status','secretaria','gerencia','equipamento','responsavel','obs'];
function exportar(tipo){
  const rows=filtrados().map(b=>{const o={};CAMPOS.forEach(c=>o[c]=c==='secretaria'?(b.local_id?L(b.local_id):''):c==='gerencia'?(GN(b.gerencia_id)||''):c==='equipamento'?(EN(b.equipamento_id)||''):b[c]??'');o.valor_atual=deprec(b).atual.toFixed(2);return o});
  const ws=XLSX.utils.json_to_sheet(rows);
  if(tipo==='csv')salvarArquivo('patrimonio.csv',new Blob(['\ufeff'+XLSX.utils.sheet_to_csv(ws)],{type:'text/csv;charset=utf-8'}));
  else{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Bens');salvarArquivo('patrimonio.xlsx',new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/octet-stream'}))}}
async function importar(file){
  if(!file)return;const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  if(!rows.length)return alert('Arquivo vazio.');
  const norm=v=>v instanceof Date?v.toISOString().slice(0,10):String(v??'').trim(),low=s=>s.toLowerCase();
  const secs={},gers={},eqs={};S.locais.forEach(l=>secs[low(l.nome)]=l.id);(S.gerencias||[]).forEach(g=>gers[g.secretaria_id+'|'+low(g.nome)]=g.id);(S.equipamentos||[]).forEach(e=>eqs[e.gerencia_id+'|'+low(e.nome)]=e.id);
  const out=[];
  for(const r of rows){const o={};CAMPOS.forEach(c=>o[c]=norm(r[c]));if(!o.secretaria)o.secretaria=norm(r.local);
    if(!o.tombo||!o.descricao)continue;
    if(o.secretaria){const k=low(o.secretaria);if(!secs[k]){const[n]=await Repo.upsert('locais',{nome:o.secretaria});secs[k]=n.id}o.local_id=secs[k];
      if(!S.semEstrutura){
        if(o.gerencia){const kg=o.local_id+'|'+low(o.gerencia);if(!gers[kg]){const[n]=await Repo.upsert('gerencias',{secretaria_id:o.local_id,nome:o.gerencia});gers[kg]=n.id}o.gerencia_id=gers[kg];
          o.equipamento_id=null;if(o.equipamento){const ke=o.gerencia_id+'|'+low(o.equipamento);if(!eqs[ke]){const[n]=await Repo.upsert('equipamentos',{gerencia_id:o.gerencia_id,nome:o.equipamento});eqs[ke]=n.id}o.equipamento_id=eqs[ke]}}
        else{const ex=S.bens.find(x=>x.tombo.toLowerCase()===low(o.tombo)),same=ex&&ex.local_id===o.local_id;o.gerencia_id=same?(ex.gerencia_id||null):null;o.equipamento_id=same?(ex.equipamento_id||null):null}}}
    delete o.secretaria;delete o.gerencia;delete o.equipamento;
    ['valor','valor_residual'].forEach(k=>o[k]=+o[k]||0);o.vida_util_anos=o.vida_util_anos?+o.vida_util_anos:null;
    ['data_aquisicao','garantia_ate'].forEach(k=>o[k]=o[k]||null);o.estado=o.estado||'Bom';o.status=o.status||'Ativo';out.push(o)}
  if(!out.length)return alert('Nenhuma linha válida (tombo e descrição são obrigatórios).');
  if(!confirm(`Importar ${out.length} bens? Tombos já existentes serão atualizados. Secretarias, gerências e equipamentos novos serão criados.`))return;
  await Repo.upsert('bens',out,'tombo');alert('Importação concluída.');await refresh()}

async function saveEst(t,id){if(!adm())return;
  if(S.semEstrutura&&t!=='sec'){$('#eerr').textContent='Rode o hierarquia.sql no Supabase primeiro.';return}
  const tb=TBL[t],old=id?S[tb].find(r=>r.id===id):null,g=k=>{const e=$('#e_'+k);return e?e.value.trim():undefined},nome=g('nome');
  if(!nome){$('#eerr').textContent='Informe o nome.';return}

  if(S[tb].some(r=>r.id!==id&&r.nome.trim().toLowerCase()===nome.toLowerCase()&&(t==='sec'||(t==='ger'?r.secretaria_id===par:r.gerencia_id===par)))){$('#eerr').textContent='Já existe um registro com este nome neste nível.';return}
  const row={...(old||{ativo:true}),nome};
  if(t!=='eq')row.sigla=g('sigla')||null;if(t==='sec')row.setor=g('setor')||null;
  if(t==='eq'){row.tipo=g('tipo')||null;row.endereco=g('endereco')||null}

async function toggleEst(t,id){if(!adm())return;const tb=TBL[t],r=S[tb].find(x=>x.id===id),novo=r.ativo===false;

async function delEst(t,id){if(!adm())return;const tb=TBL[t],r=S[tb].find(x=>x.id===id);
  const dep=t==='sec'?(S.bens.some(b=>b.local_id===id)||(S.gerencias||[]).some(g=>g.secretaria_id===id)):t==='ger'?(S.bens.some(b=>b.gerencia_id===id)||(S.equipamentos||[]).some(e=>e.gerencia_id===id)):S.bens.some(b=>b.equipamento_id===id);

  if(!confirm(`Excluir "${r.nome}"?`))return;await Repo.remove(tb,id);await refresh()}

/* ======== LEITOR / INVENTÁRIO ======== */
let leitura='avulso',modoAvulso='consulta',fila=[],finFila=false;
function scan(){
  const lote=leitura==='lote';modo=lote?'inv':modoAvulso;
  $('#main').innerHTML=`<div class="card"><div class="row">
  <div><label>Tipo de leitura</label><select id="lt"><option value="avulso">Avulso — um por vez</option><option value="lote">Em lote — câmera contínua</option></select></div>
  <div id="mdw"><label>Finalidade</label><select id="md"><option value="consulta">Consulta</option><option value="inv">Inventário (conferir bens do local)</option></select></div>
  <div id="invw"><label>Local sendo conferido</label><select id="il">${S.locais.map(l=>`<option value="${l.id}">${esc(l.nome)}</option>`).join('')}</select></div></div>
  <div class="row" style="margin-top:10px"><button class="pri" id="bs">📷 Ler com a câmera</button><button id="bx" style="display:none">Parar</button>
  <label style="display:flex;gap:6px;align-items:center;color:var(--tx);font-size:14px;margin:0;flex:0 0 auto"><input type="checkbox" id="som" style="width:auto"> 🔊 Bip</label>
  <label style="display:flex;gap:6px;align-items:center;color:var(--tx);font-size:14px;margin:0;flex:0 0 auto"><input type="checkbox" id="vib" style="width:auto"> 📳 Vibrar</label></div>
  <div id="reader" style="margin-top:10px"></div><p id="cerr" class="err"></p>
  <div class="row"><input id="man" placeholder="Ou digite o tombo (ex.: PAT-000001)"><button onclick="onCode($('#man').value)">${lote?'Adicionar à fila':'Buscar'}</button></div>
  <p id="aviso" class="mut" style="margin:8px 0 0;font-size:13px">${lote?'Aponte a câmera para os QR Codes: cada bem lido entra na fila abaixo, sem fechar a câmera.':''}</p></div>
  <div id="fila"></div><div id="res"></div><div id="inv"></div>`;
  $('#lt').value=leitura;$('#mdw').style.display=lote?'none':'';$('#md').value=modoAvulso;
  $('#il').value=invLocal||S.locais[0]?.id||'';invLocal=$('#il').value;$('#invw').style.display=modo==='inv'?'':'none';
  $('#lt').onchange=async e=>{await stopScan();if(leitura==='avulso')modoAvulso=modo;leitura=e.target.value;fila=[];sess=[];curConf=null;scan()};
  $('#md').onchange=e=>{modo=modoAvulso=e.target.value;$('#invw').style.display=modo==='inv'?'':'none';invList()};
  $('#il').onchange=e=>{invLocal=e.target.value;sess=[];curConf=null;fila=[];renderFila();invList()};
  $('#som').checked=somOn;$('#som').onchange=e=>{somOn=e.target.checked;try{localStorage.setItem('pat_som',somOn?'1':'0')}catch(x){}if(somOn)bip(true)};
  $('#vib').checked=vibOn;$('#vib').onchange=e=>{vibOn=e.target.checked;try{localStorage.setItem('pat_vib',vibOn?'1':'0')}catch(x){}if(vibOn&&navigator.vibrate)navigator.vibrate(60)};
  $('#man').onkeydown=e=>{if(e.key==='Enter')onCode($('#man').value)};$('#bs').onclick=startScan;$('#bx').onclick=stopScan;renderFila();invList()}
function renderFila(){const w=$('#fila');if(!w)return;if(leitura!=='lote'){w.innerHTML='';return}
  w.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>📋 Fila de leitura — ${fila.length} pendente(s)</b>${fila.length?`<button class="sm" onclick="limparFila()">Limpar</button>`:''}</div>
  ${fila.map(it=>{const b=S.bens.find(x=>x.id===it.id)||{},dif=b.local_id!==invLocal;return `<div style="padding:7px 0;border-top:1px solid var(--bd)"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div style="min-width:0"><b>${esc(b.tombo)}</b> ${esc(b.descricao)}<br><span class="mut" style="font-size:12.5px">Cadastrado em: ${esc(P(b.local_id,b.gerencia_id,b.equipamento_id))}</span>${it.erro?`<br><span class="err" style="font-size:12.5px">${esc(it.erro)}</span>`:''}</div><button class="sm bad" onclick="tirarFila('${it.id}')">✕</button></div>
  ${dif?`<label style="display:flex;gap:6px;align-items:center;color:var(--warn);font-size:13px;margin:4px 0 0"><input type="checkbox" style="width:auto" ${it.mover?'checked':''} onchange="moverFila('${it.id}',this.checked)"> ⚠ Em outro local — mover para ${esc(L(invLocal))}</label>`:''}</div>`}).join('')||'<p class="mut" style="margin:8px 0 0">Nenhum bem lido ainda.</p>'}
  ${fila.length?`<label style="margin-top:10px;display:flex;gap:6px;align-items:center;color:var(--tx);font-size:14px"><input type="checkbox" style="width:auto" ${finFila?'checked':''} onchange="finFila=this.checked"> Finalizar o inventário ao confirmar (registrar faltantes)</label>`:''}
  <button class="pri" id="bconf" style="margin-top:8px;width:100%" ${fila.length?'':'disabled'} onclick="confirmarFila()">✔ Confirmar Inventário (${fila.length})</button></div>`}
function limparFila(){if(fila.length&&!confirm('Limpar a fila de leitura?'))return;fila=[];renderFila()}
function tirarFila(id){fila=fila.filter(x=>x.id!==id);renderFila()}
function moverFila(id,v){const it=fila.find(x=>x.id===id);if(it)it.mover=v}
async function confirmarFila(){
  if(!fila.length)return;const btn=$('#bconf');if(btn){btn.disabled=true;btn.textContent='Registrando…'}
  let ok=0,falhas=0;
  try{
    if(!curConf)curConf=await Repo.rpc('iniciar_conferencia',{p_local:invLocal,p_tipo:'Inventário'});
    for(const it of [...fila]){
      try{await Repo.rpc('conferir_bem',{p_bem:it.id,p_local:invLocal,p_mover:!!it.mover,p_conf:curConf});ok++;if(!sess.includes(it.id))sess.push(it.id);fila=fila.filter(x=>x.id!==it.id)}
      catch(e){falhas++;it.erro=e.message||String(e)}
    }
    await reload();
    if(finFila&&!falhas){
      const mk=$('#mk');await Repo.rpc('finalizar_conferencia',{p_conf:curConf,p_marcar:!!(mk&&mk.checked)});
      const id=curConf;curConf=null;sess=[];fila=[];await reload();renderFila();invList();goConf=true;showConf(id);return}
    $('#res').innerHTML=`<div class="card ${falhas?'warn':'ok'}">✔ ${ok} bem(ns) confirmado(s) no inventário${falhas?` · <span class="err">${falhas} com erro (mantidos na fila)</span>`:''}.${finFila&&falhas?' O inventário não foi finalizado.':''}</div>`;
  }catch(e){$('#res').innerHTML=`<div class="card err"><b>Falha ao confirmar:</b> ${esc(e.message||e)}</div>`}
  renderFila();invList()}
async function startScan(){
  audioInit();$('#cerr').textContent='';
  const msg=e=>(e&&e.message)||String(e);
  try{
    if(isNative()&&Capacitor.Plugins.Camera){
      const p=await Capacitor.Plugins.Camera.requestPermissions({permissions:['camera']});
      if(p.camera!=='granted')throw new Error('Permissão da câmera negada. Ative em Configurações > Apps > Patrimônio > Permissões > Câmera.');
    }
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Câmera indisponível neste modo (a página precisa abrir em HTTPS).');
    sc=new Html5Qrcode('reader');const cfg={fps:10,qrbox:230},ok=c=>onCode(c);
    try{await sc.start({facingMode:'environment'},cfg,ok)}
    catch(e1){const cams=await Html5Qrcode.getCameras();if(!cams||!cams.length)throw e1;
      const back=cams.find(c=>/back|traseira|environment|rear/i.test(c.label))||cams[cams.length-1];await sc.start(back.id,cfg,ok)}
    $('#bs').style.display='none';$('#bx').style.display='';
  }catch(e){try{if(sc)sc.clear()}catch(x){}sc=null;$('#cerr').textContent='Não foi possível abrir a câmera: '+msg(e)+' — ou use a digitação manual.'}}
async function stopScan(){if(sc){try{await sc.stop();sc.clear()}catch(e){}sc=null}const a=$('#bs');if(a){a.style.display='';$('#bx').style.display='none'}}
function onCode(code){code=(code||'').trim();if(!code)return;const n=Date.now();if(lastScan.c===code&&n-lastScan.t<3000)return;lastScan={c:code,t:n};
  const b=S.bens.find(x=>x.tombo.toLowerCase()===code.toLowerCase()||x.id===code);
  if(leitura==='lote'){
    const av=m=>{const a=$('#aviso');if(a)a.innerHTML=m};
    if(!b){bip(false);av(`<span class="err">Código não encontrado:</span> ${esc(code)} (inexistente ou fora dos seus locais)`);return}
    if(b.status==='Baixado'){bip(false);av(`<span class="err">${esc(b.tombo)} está baixado.</span>`);return}
    if(sess.includes(b.id)){av(`${esc(b.tombo)} já foi confirmado neste inventário.`);return}
    if(fila.some(x=>x.id===b.id)){av(`${esc(b.tombo)} já está na fila.`);return}
    bip(true);fila.unshift({id:b.id,mover:false});av(`<span class="ok">✔ ${esc(b.tombo)} adicionado à fila.</span>`);renderFila();const m=$('#man');if(m)m.value='';return}
  if(!b){bip(false);$('#res').innerHTML=`<div class="card"><b class="err">Código não encontrado:</b> ${esc(code)} <span class="mut">(inexistente ou fora dos seus locais)</span></div>`;return}
  bip(true);const dif=modo==='inv'&&b.local_id!==invLocal;
  $('#res').innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b style="font-size:17px">${esc(b.tombo)}</b><span class="tag">${esc(b.status)}</span></div>
  <p style="margin:6px 0">${esc(b.descricao)}<br><span class="mut">${esc([b.marca,b.modelo,b.serie&&'S/N '+b.serie].filter(Boolean).join(' · '))}</span></p>
  <p class="mut" style="margin:4px 0">Alocação: <b>${esc(P(b.local_id,b.gerencia_id,b.equipamento_id))}</b> · Resp.: ${esc(b.responsavel||'—')}<br>Última conferência: ${dt(b.verificado_em)}</p>${dif?'<p class="warn">⚠ Cadastrado em outro local.</p>':''}
  <div class="row" style="margin-top:8px">${modo==='inv'?`<button class="pri" onclick="conf('${b.id}',false)">✔ Confirmar presença</button>${dif?`<button onclick="conf('${b.id}',true)">Mover para ${esc(L(invLocal))}</button>`:''}`:`<button onclick="showFicha('${b.id}')">Abrir ficha</button><button onclick="conf('${b.id}',false)">Registrar conferência</button>`}<button onclick="cancelarBusca()">Cancelar</button></div></div>`}
function cancelarBusca(){$('#res').innerHTML='';const m=$('#man');if(m)m.value='';lastScan={c:'',t:0}}
let curConf=null;
async function reload(){const[b,m,c,i]=await Promise.all([Repo.list('bens'),Repo.list('movimentacoes'),Repo.list('conferencias').catch(()=>S.conferencias||[]),Repo.list('conferencia_itens').catch(()=>S.conferencia_itens||[])]);S.bens=b;S.movimentacoes=m;S.conferencias=c;S.conferencia_itens=i}
async function conf(id,move){
  const b0=S.bens.find(x=>x.id===id);
  try{
    if(modo==='inv'&&!curConf)curConf=await Repo.rpc('iniciar_conferencia',{p_local:invLocal,p_tipo:'Inventário'});
    await Repo.rpc('conferir_bem',{p_bem:id,p_local:modo==='inv'?invLocal:null,p_mover:move,p_conf:modo==='inv'?curConf:null});
    if(modo==='inv'&&!sess.includes(id))sess.push(id);
    await reload();
    const b=S.bens.find(x=>x.id===id);
    if(!b.verificado_em||b.verificado_em===b0.verificado_em)throw new Error('O banco não registrou a conferência.');
    $('#res').innerHTML=`<div class="card ok">✔ ${esc(b.tombo)} conferido em ${new Date(b.verificado_em).toLocaleString('pt-BR')} e gravado no banco.</div>`;
  }catch(e){$('#res').innerHTML=`<div class="card err"><b>Falha ao registrar a conferência:</b> ${esc(e.message||e)}<br><span class="mut">Se citar função ou tabela inexistente, rode o conferencia.sql no Supabase.</span></div>`}
  invList()}
function invList(){const w=$('#inv');if(!w)return;if(modo!=='inv'){w.innerHTML='';return}
  const esp=S.bens.filter(b=>b.local_id===invLocal&&b.status!=='Baixado'),falt=esp.filter(b=>!sess.includes(b.id));
  w.innerHTML=`<div class="card"><b>Inventário: ${esc(L(invLocal))}</b><p class="mut" style="margin:4px 0">${sess.length} conferidos · <span class="${falt.length?'warn':'ok'}">${falt.length} faltando</span> de ${esp.length}</p>
  ${falt.map(b=>`<div style="padding:5px 0;border-top:1px solid var(--bd)"><b>${esc(b.tombo)}</b> ${esc(b.descricao)}</div>`).join('')}
  <label style="margin-top:10px;display:flex;gap:6px;align-items:center;font-size:14px;color:var(--tx)"><input type="checkbox" id="mk" style="width:auto"> Marcar faltantes como “Não localizado”</label>
  <button class="pri" style="margin-top:8px" onclick="finalizarInv()">Finalizar inventário</button></div>`}
async function finalizarInv(){
  if(fila.length&&!confirm(`Há ${fila.length} bem(ns) na fila ainda não confirmados. Finalizar assim mesmo? Eles ficarão como faltantes.`))return;
  if(!sess.length&&!confirm('Nenhum bem foi conferido. Finalizar mesmo assim (todos ficarão como faltantes)?'))return;
  const mk=$('#mk').checked;if(!curConf)curConf=await Repo.rpc('iniciar_conferencia',{p_local:invLocal,p_tipo:'Inventário'});
  await Repo.rpc('finalizar_conferencia',{p_conf:curConf,p_marcar:mk});
  const id=curConf;curConf=null;sess=[];await reload();$('#res').innerHTML='';invList();goConf=true;showConf(id)}
const confTot=c=>{const it=(S.conferencia_itens||[]).filter(i=>i.conferencia_id===c.id),n=r=>it.filter(i=>i.resultado===r).length;return{ok:it.length-n('Faltante'),falt:n('Faltante'),div:n('Local divergente')+n('Movido'),it}};
function confs(){
  const r=[...(S.conferencias||[])].sort((a,b)=>a.iniciada_em<b.iniciada_em?1:-1);
  $('#main').innerHTML=`<div class="card tw"><table><tr><th>Data</th><th>Tipo</th><th>Local</th><th>Responsável</th><th>Conferidos</th><th>Faltantes</th><th>Divergentes</th><th></th></tr>
  ${r.map(c=>{const t=confTot(c);return `<tr><td>${new Date(c.iniciada_em).toLocaleString('pt-BR')}${c.finalizada_em?'':' <span class="tag warn">em andamento</span>'}</td><td>${esc(c.tipo)}</td><td>${esc(L(c.local_id))}</td><td>${esc(c.usuario_email)}</td><td>${t.ok}</td><td class="${t.falt?'warn':''}">${t.falt}</td><td>${t.div}</td><td><button class="sm" onclick="showConf('${c.id}')">Detalhes</button> <button class="sm" onclick="imprimirConf('${c.id}')">Imprimir</button>${adm()?` <button class="sm bad" onclick="delConf('${c.id}')">Excluir</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="8" class="mut">Nenhuma conferência registrada.</td></tr>'}</table></div>`}
function imprimirConf(id){
  const c=S.conferencias.find(x=>x.id===id),t=confTot(c),fmt=v=>v?new Date(v).toLocaleString('pt-BR'):'—';
  const bem=i=>S.bens.find(x=>x.id===i.bem_id)||{};
  const rows=[...t.it].sort((a,b)=>String(bem(a).tombo||'').localeCompare(String(bem(b).tombo||''),'pt-BR',{numeric:true}));
  $('#printarea').innerHTML=`<div class="rep"><h2>Conferência — ${esc(c.tipo)}</h2><div style="color:#444">Controle de Patrimônio</div>
  <table><tr><th style="width:22%">Local</th><td>${esc(L(c.local_id))}</td><th style="width:18%">Responsável</th><td>${esc(c.usuario_email||'—')}</td></tr>
  <tr><th>Início</th><td>${fmt(c.iniciada_em)}</td><th>Término</th><td>${c.finalizada_em?fmt(c.finalizada_em):'Em andamento'}</td></tr>
  <tr><th>Bens esperados</th><td>${c.total_esperado||0}</td><th>Conferidos</th><td>${t.ok}</td></tr>
  <tr><th>Faltantes</th><td>${t.falt}</td><th>Divergentes / movidos</th><td>${t.div}</td></tr></table>
  <table><tr><th style="width:5%">Nº</th><th>Tombo</th><th>Descrição</th><th>Resultado</th><th>Observação</th><th>Hora</th></tr>
  ${rows.map((i,n)=>`<tr><td>${n+1}</td><td><b>${esc(bem(i).tombo)}</b></td><td>${esc(bem(i).descricao)}</td><td>${esc(i.resultado)}</td><td>${esc(i.obs)}</td><td>${new Date(i.data).toLocaleTimeString('pt-BR')}</td></tr>`).join('')||'<tr><td colspan="6">Sem itens.</td></tr>'}</table>
  <div class="sig"><div>Responsável pela conferência</div><div>Responsável pelo local</div></div>
  <div style="margin-top:14px;font-size:10px;color:#555">Emitido em ${new Date().toLocaleString('pt-BR')}</div></div>`;
  printNow('Conferencia')}
const RES=['Presente','Local divergente','Movido','Faltante'];
function showConf(id){const c=S.conferencias.find(x=>x.id===id),t=confTot(c);
  $('#dlg').innerHTML=`<h3 style="margin-top:0">Conferência — ${esc(c.tipo)}</h3><p class="mut">${esc(L(c.local_id))} · ${new Date(c.iniciada_em).toLocaleString('pt-BR')} · ${esc(c.usuario_email)}<br>${t.ok} conferidos · ${t.falt} faltantes · ${t.div} divergentes</p>
  <div class="tw"><table><tr><th>Tombo</th><th>Descrição</th><th>Resultado</th><th>Obs.</th><th>Hora</th>${adm()?'<th></th>':''}</tr>${t.it.map(i=>{const b=S.bens.find(x=>x.id===i.bem_id)||{};return `<tr><td><b>${esc(b.tombo)}</b></td><td>${esc(b.descricao)}</td><td class="${i.resultado==='Faltante'?'err':i.resultado==='Presente'?'ok':'warn'}">${esc(i.resultado)}</td><td>${esc(i.obs)}</td><td>${new Date(i.data).toLocaleTimeString('pt-BR')}</td>${adm()?`<td><button class="sm" onclick="editItem('${id}','${i.id}')">Editar</button> <button class="sm bad" onclick="delItem('${id}','${i.id}')">Excluir</button></td>`:''}</tr>`}).join('')||'<tr><td colspan="6" class="mut">Sem itens.</td></tr>'}</table></div>
  <div class="row" style="justify-content:flex-end;margin-top:10px">${adm()?`<button class="bad" onclick="delConf('${id}')">Excluir conferência</button>`:''}<button class="pri" onclick="imprimirConf('${id}')">🖨 Imprimir / PDF</button><button onclick="$('#dlg').close()">Fechar</button></div>`;if(!$('#dlg').open)$('#dlg').showModal()}
function editItem(cid,iid){if(!adm())return;const i=S.conferencia_itens.find(x=>x.id===iid),b=S.bens.find(x=>x.id===i.bem_id)||{};
  $('#dlg').innerHTML=`<h3 style="margin-top:0">Editar item — ${esc(b.tombo)}</h3><p class="mut">${esc(b.descricao)}</p>
  <div class="g2"><div><label>Resultado</label><select id="ir">${RES.map(r=>`<option ${i.resultado===r?'selected':''}>${r}</option>`).join('')}</select></div><div><label>Observação</label><input id="io" value="${esc(i.obs)}"></div></div>
  <p class="mut" style="font-size:12.5px">Altera apenas o registro desta conferência, não os dados do bem.</p>
  <div class="row" style="justify-content:flex-end"><button onclick="showConf('${cid}')">Voltar</button><button class="pri" onclick="saveItem('${cid}','${iid}')">Salvar</button></div>`}
async function saveItem(cid,iid){const i=S.conferencia_itens.find(x=>x.id===iid);await Repo.upsert('conferencia_itens',{...i,resultado:$('#ir').value,obs:$('#io').value.trim()||null});await reload();showConf(cid)}
async function delItem(cid,iid){if(!confirm('Excluir este item da conferência?'))return;await Repo.remove('conferencia_itens',iid);await reload();showConf(cid)}
async function delConf(id){if(!confirm('Excluir esta conferência e todos os seus itens? As datas de última conferência dos bens não serão alteradas.'))return;
  await Repo.remove('conferencias',id);await reload();$('#dlg').close();render()}

/* ======== ETIQUETAS ======== */
let FL={l:'',g:'',e:''};
function labels(){
  const r=S.bens.filter(b=>b.status!=='Baixado'&&matchEst(b,FL));
  $('#main').innerHTML=`<div class="card"><div class="g2">${cascata('el',{s:FL.l,g:FL.g,e:FL.e},FOPT)}</div><div class="row" style="margin-top:10px"><button class="pri" id="ep">🖨 Imprimir selecionadas</button></div></div><div class="card"><div class="labels" id="lb">${r.map(b=>`<label class="lbl" style="cursor:pointer;margin:0"><input type="checkbox" value="${b.id}" checked style="width:auto"><div class="qr">${qrSvg(b.tombo)}</div><b>${esc(b.tombo)}</b>${esc(b.descricao).slice(0,32)}</label>`).join('')||'<span class="mut">Sem bens.</span>'}</div></div>`;
  $('#els').onchange=e=>{FL.l=e.target.value;FL.g='';FL.e='';labels()};$('#elg').onchange=e=>{FL.g=e.target.value;FL.e='';labels()};$('#ele').onchange=e=>{FL.e=e.target.value;labels()};
  $('#ep').onclick=()=>{const ids=[...document.querySelectorAll('#lb input:checked')].map(i=>i.value);ids.length&&printLabels(ids)}}

/* ======== RELATÓRIOS E HISTÓRICO DE MOVIMENTAÇÕES ======== */
const txtEst=(s,g,e)=>[s?L(s):'Todas as secretarias',g?(g==='_'?'Sem gerência definida':GN(g)):'Todas as gerências',e?EN(e):'Todos os equipamentos / unidades'].join(' › ');
function relatorio(titulo,sub,cols,rows,rodape){
  $('#printarea').innerHTML=`<div class="rep"><h2>${esc(titulo)}</h2><div style="color:#444">${esc(sub)}</div>
  <table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c??'')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}">Nenhum registro.</td></tr>`}</table>
  <div style="margin-top:12px;font-size:11px;color:#333">${esc(rodape||'')}</div><div style="margin-top:6px;font-size:10px;color:#555">Emitido em ${new Date().toLocaleString('pt-BR')} por ${esc(ME.email)}</div></div>`;printNow(titulo)}
function imprimirBens(){const r=[...filtrados()].sort((a,b)=>(P(a.local_id,a.gerencia_id,a.equipamento_id)+'|'+a.tombo).localeCompare(P(b.local_id,b.gerencia_id,b.equipamento_id)+'|'+b.tombo,'pt-BR',{numeric:true}));
  relatorio('Relatório de bens patrimoniais',txtEst(F.l,F.g,F.e)+(F.s?' · Status: '+F.s:'')+(F.q?' · Busca: '+F.q:''),
    ['Tombo','Descrição','Secretaria','Gerência','Equipamento / Unidade','Status','Valor atual'],
    r.map(b=>[b.tombo,b.descricao,b.local_id?L(b.local_id):'—',GN(b.gerencia_id)||'—',EN(b.equipamento_id)||'—',b.status,b.status==='Baixado'?'—':brl(deprec(b).atual)]),
    `Total: ${r.length} bem(ns) · Valor contábil: ${brl(r.reduce((s,b)=>s+(b.status==='Baixado'?0:deprec(b).atual),0))}`)}
let FH={q:'',t:'',l:'',g:'',e:'',de:'',ate:''};
function hMov(){const bem=id=>S.bens.find(x=>x.id===id)||{},q=FH.q.toLowerCase(),lado=(s,g,e)=>matchEst({local_id:s,gerencia_id:g,equipamento_id:e},FH);
  return [...(S.movimentacoes||[])].filter(m=>{const b=bem(m.bem_id);if(q&&!((b.tombo||'')+(b.descricao||'')).toLowerCase().includes(q))return false;
    if(FH.t&&m.tipo!==FH.t)return false;const d=new Date(m.data).toLocaleDateString('sv-SE');if(FH.de&&d<FH.de)return false;if(FH.ate&&d>FH.ate)return false;
    return lado(m.de_local_id,m.de_gerencia_id,m.de_equipamento_id)||lado(m.para_local_id,m.para_gerencia_id,m.para_equipamento_id)}).sort((a,b)=>a.data<b.data?1:-1)}
const lado=(s,g,e)=>s?P(s,g,e):'—';
function hist(){
  const bem=id=>S.bens.find(x=>x.id===id)||{},r=hMov(),tipos=[...new Set((S.movimentacoes||[]).map(m=>m.tipo).filter(Boolean))].sort();
  $('#main').innerHTML=`<div class="card"><div class="row"><input id="hq" placeholder="Buscar tombo ou descrição…" value="${esc(FH.q)}"><select id="ht"><option value="">Todos os tipos</option>${tipos.map(t=>`<option ${FH.t===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
  <div class="g2" style="margin-top:8px">${cascata('hh',{s:FH.l,g:FH.g,e:FH.e},FOPT)}<div><label>De</label><input id="hde" type="date" value="${FH.de}"></div><div><label>Até</label><input id="hate" type="date" value="${FH.ate}"></div></div>
  <div class="row" style="margin-top:8px"><button onclick="imprimirHist()">🖨 Imprimir / PDF</button></div>
  <p class="mut" style="margin:8px 0 0;font-size:13px">${r.length} movimentação(ões). O filtro de estrutura considera origem ou destino.</p></div>
  <div class="card tw"><table><tr><th>Data e hora</th><th>Tombo</th><th>Bem</th><th>Tipo</th><th>Origem</th><th>Destino</th><th>Usuário</th><th>Obs.</th></tr>
  ${r.slice(0,300).map(m=>`<tr><td>${fdt(m.data)}</td><td><b>${esc(bem(m.bem_id).tombo)}</b></td><td style="white-space:normal">${esc(bem(m.bem_id).descricao)}</td><td>${esc(m.tipo)}</td><td style="white-space:normal;min-width:170px">${esc(lado(m.de_local_id,m.de_gerencia_id,m.de_equipamento_id))}</td><td style="white-space:normal;min-width:170px">${esc(lado(m.para_local_id,m.para_gerencia_id,m.para_equipamento_id))}</td><td>${esc(m.usuario_email||'—')}</td><td style="white-space:normal">${esc(m.obs)}</td></tr>`).join('')||'<tr><td colspan="8" class="mut">Nenhuma movimentação.</td></tr>'}</table></div>
  ${r.length>300?'<p class="mut">Mostrando as 300 mais recentes. Use os filtros ou imprima o relatório completo.</p>':''}`;
  $('#hq').oninput=e=>{FH.q=e.target.value;clearTimeout(hist.t);hist.t=setTimeout(()=>{hist();const i=$('#hq');i.focus();i.setSelectionRange(FH.q.length,FH.q.length)},250)};
  $('#ht').onchange=e=>{FH.t=e.target.value;hist()};
  $('#hhs').onchange=e=>{FH.l=e.target.value;FH.g='';FH.e='';hist()};$('#hhg').onchange=e=>{FH.g=e.target.value;FH.e='';hist()};$('#hhe').onchange=e=>{FH.e=e.target.value;hist()};
  $('#hde').onchange=e=>{FH.de=e.target.value;hist()};$('#hate').onchange=e=>{FH.ate=e.target.value;hist()}}
function imprimirHist(){const bem=id=>S.bens.find(x=>x.id===id)||{},r=hMov();
  relatorio('Histórico de movimentações patrimoniais',txtEst(FH.l,FH.g,FH.e)+(FH.t?' · Tipo: '+FH.t:'')+(FH.de||FH.ate?` · Período: ${FH.de?new Date(FH.de+'T12:00:00').toLocaleDateString('pt-BR'):'início'} a ${FH.ate?new Date(FH.ate+'T12:00:00').toLocaleDateString('pt-BR'):'hoje'}`:''),
    ['Data e hora','Tombo','Bem','Tipo','Origem','Destino','Usuário','Obs.'],
    r.map(m=>[fdt(m.data),bem(m.bem_id).tombo||'—',bem(m.bem_id).descricao||'—',m.tipo,lado(m.de_local_id,m.de_gerencia_id,m.de_equipamento_id),lado(m.para_local_id,m.para_gerencia_id,m.para_equipamento_id),m.usuario_email||'—',m.obs||'']),
    `Total: ${r.length} movimentação(ões)`)}

boot().catch(e=>{$('#app').innerHTML='<div class="card" id="login"><b class="err">Erro ao iniciar:</b><br>'+esc(e.message||e)+'<br><br><button onclick="location.reload()">Tentar de novo</button></div>'});
</script>
</body>
